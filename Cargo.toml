[package]
name = "geniewish"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "A voice interface for working on your Mac"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time", "signal"] }

[dev-dependencies]
tempfile = "3"
